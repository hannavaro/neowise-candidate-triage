<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f5fa">
  <title>Входящие заявки · Neowise</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17213b;
      --muted: #56627a;
      --line: #dce2ee;
      --accent: #503fbe;
      --soft-accent: #eeebff;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background: #f3f5fa;
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; }
    button, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; }
    :focus-visible { outline: 3px solid #7461e2; outline-offset: 3px; }

    .wrap { width: min(68rem, calc(100% - 3rem)); margin-inline: auto; }
    .masthead { background: #fff; border-bottom: 1px solid var(--line); }
    .masthead .wrap { display: flex; align-items: center; min-height: 4.25rem; }
    .brand { display: inline-flex; align-items: center; gap: .75rem; font-size: 1.125rem; font-weight: 750; letter-spacing: -.03em; }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 2rem;
      height: 2rem;
      border-radius: 10px;
      color: white;
      background: var(--accent);
      font-size: .95rem;
      font-weight: 800;
    }

    main { padding-block: 2.25rem 3rem; }
    .intro {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      padding: 2.5rem 2.75rem;
      border-radius: 24px;
      background: linear-gradient(115deg, #161f3e 25%, #292758 67%, #443783);
      color: #fff;
    }
    .intro::after {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      background: repeating-radial-gradient(circle at 90% 105%, transparent 0 24px, #c8bcff28 25px 26px);
      mask-image: linear-gradient(to right, transparent 54%, black);
    }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: clamp(2rem, 5vw, 3rem); line-height: 1.12; font-weight: 750; letter-spacing: -.045em; }
    .intro p { max-width: 34rem; margin-top: .75rem; color: #e2e4f3; line-height: 1.55; }

    .workspace { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.125rem; margin-top: 1.125rem; }
    .card {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 23rem;
      padding: 1.5rem;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 4px 14px #1e2c4d06;
    }
    .card-heading { display: flex; align-items: center; justify-content: space-between; gap: .5rem 1rem; flex-wrap: wrap; min-height: 2.25rem; margin-bottom: 1rem; }
    h2 { font-size: 1.25rem; line-height: 1.35; font-weight: 730; letter-spacing: -.025em; }
    .example {
      padding: .375rem .7rem;
      border: 0;
      border-radius: 8px;
      background: var(--soft-accent);
      color: #43319e;
      font-size: .875rem;
      font-weight: 650;
    }
    .example:hover:not(:disabled) { background: #e4dfff; }
    .example:disabled { opacity: .55; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    textarea {
      display: block;
      flex: 1;
      width: 100%;
      min-height: 11rem;
      padding: 1rem;
      resize: vertical;
      border: 1px solid #cbd4e5;
      border-radius: 12px;
      color: var(--ink);
      background: #fafbfe;
      line-height: 1.6;
    }
    textarea::placeholder { color: #657087; }
    textarea[aria-invalid="true"] { border-color: #b13845; }
    .input-error { margin-top: .55rem; color: #a12636; font-size: .875rem; }
    .submit {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .7rem;
      align-self: flex-start;
      min-height: 2.9rem;
      margin-top: 1rem;
      padding: .65rem 1.1rem;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-weight: 650;
    }
    .submit:hover:not(:disabled) { background: #40319f; }
    .submit:disabled { background: #6255b1; }
    .submit-icon { font-size: 1.15rem; line-height: 1; }

    .result { display: flex; flex: 1; flex-direction: column; }
    .status {
      display: grid;
      flex: 1;
      place-content: center;
      justify-items: center;
      gap: .55rem;
      min-height: 14rem;
      padding: 1.35rem;
      border: 1px dashed #cbd4e5;
      border-radius: 12px;
      background: #fafbfe;
      text-align: center;
    }
    .status[data-state="manual"] { border: 1px solid #ebd7a9; background: #fffbf1; }
    .status-symbol {
      display: grid;
      place-items: center;
      width: 3rem;
      height: 3rem;
      margin-bottom: .3rem;
      border-radius: 13px;
      background: var(--soft-accent);
      color: var(--accent);
    }
    .status-symbol::before {
      content: "";
      width: .95rem;
      height: 1.2rem;
      border: 1.5px solid currentColor;
      border-radius: 3px;
      background: linear-gradient(currentColor, currentColor) center 40% / 53% 1.5px no-repeat,
                  linear-gradient(currentColor, currentColor) center 65% / 53% 1.5px no-repeat;
    }
    [data-state="pending"] .status-symbol::before {
      width: 1.15rem;
      height: 1.15rem;
      border: 2px solid #c3baf3;
      border-top-color: currentColor;
      border-radius: 50%;
      background: none;
      animation: spin .75s linear infinite;
    }
    [data-state="manual"] .status-symbol { color: #805211; background: #f8e8c4; }
    [data-state="manual"] .status-symbol::before {
      content: "!";
      width: auto;
      height: auto;
      border: 0;
      background: none;
      font-size: 1.4rem;
      font-weight: 750;
    }
    .status-title { font-weight: 700; }
    .status-detail { max-width: 27ch; color: var(--muted); font-size: .9rem; line-height: 1.5; }
    .status-detail:empty { display: none; }
    .topic-row { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .8rem; min-height: 2rem; }
    .topic-label { color: var(--muted); font-size: .9rem; }
    .topic { border-radius: 99px; padding: .3rem .7rem; background: var(--soft-accent); color: #43319e; font-size: .875rem; font-weight: 650; }
    .draft { margin-top: 1rem; padding: 1rem; border: 1px solid var(--line); border-radius: 12px; background: #fafbfe; }
    .draft h3 { margin-bottom: .5rem; font-size: .95rem; }
    .draft p { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.6; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .status-symbol::before { animation: none !important; } }
    @media (max-width: 46rem) {
      .wrap { width: min(100% - 2rem, 38rem); }
      main { padding-top: 1.25rem; }
      .intro { padding: 1.55rem; border-radius: 19px; }
      .workspace { grid-template-columns: minmax(0, 1fr); }
      .card { min-height: auto; padding: 1.15rem; border-radius: 16px; }
      .status { min-height: 11rem; }
    }
    @media (max-width: 26rem) { .submit { align-self: stretch; } }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="wrap">
      <div class="brand"><span class="brand-mark" aria-hidden="true">N</span>Neowise</div>
    </div>
  </header>
  <main class="wrap">
    <div class="intro">
      <h1>Входящие заявки</h1>
      <p>Вставьте сообщение клиента, чтобы получить тему заявки и черновик ответа.</p>
    </div>
    <div class="workspace">
      <form class="card" aria-labelledby="form-heading">
        <div class="card-heading">
          <h2 id="form-heading">Заявка клиента</h2>
          <button class="example" id="example" type="button">Подставить пример</button>
        </div>
        <label class="visually-hidden" for="message">Текст заявки</label>
        <textarea id="message" rows="6" placeholder="Вставьте текст сообщения…" aria-describedby="input-error"></textarea>
        <p class="input-error" id="input-error" role="alert" hidden>Введите текст заявки.</p>
        <button class="submit" type="submit">
          <span id="submit-label">Разобрать заявку</span>
          <span class="submit-icon" aria-hidden="true">→</span>
        </button>
      </form>
      <section class="card" aria-labelledby="result-heading">
        <div class="card-heading"><h2 id="result-heading">Результат разбора</h2></div>
        <div class="result" id="result" aria-live="polite" aria-atomic="true">
          <div class="status" id="status" data-state="empty">
            <span class="status-symbol" aria-hidden="true"></span>
            <p class="status-title" id="status-title">Заявка ещё не разобрана</p>
            <p class="status-detail" id="status-detail"></p>
          </div>
          <div id="answer" hidden>
            <div class="topic-row"><span class="topic-label">Тема заявки</span><span class="topic" id="topic"></span></div>
            <div class="draft"><h3>Черновик ответа</h3><p id="draft"></p></div>
          </div>
        </div>
      </section>
    </div>
  </main>
  <script type="module">
    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const example = document.querySelector("#example");
    const button = form.querySelector('button[type="submit"]');
    const submitLabel = document.querySelector("#submit-label");
    const inputError = document.querySelector("#input-error");
    const statusPanel = document.querySelector("#status");
    const statusTitle = document.querySelector("#status-title");
    const statusDetail = document.querySelector("#status-detail");
    const answer = document.querySelector("#answer");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");
    const topics = new Map([["delivery", "Доставка"], ["pricing", "Цена"], ["other", "Другое"]]);

    function showStatus(state, title, detail = "") {
      answer.hidden = true;
      topic.textContent = "";
      draft.textContent = "";
      statusPanel.dataset.state = state;
      statusTitle.textContent = title;
      statusDetail.textContent = detail;
      statusPanel.hidden = false;
    }

    function resetResult() {
      if (statusPanel.dataset.state !== "empty") {
        showStatus("empty", "Заявка ещё не разобрана");
      }
      message.removeAttribute("aria-invalid");
      inputError.hidden = true;
    }

    function showInputError() {
      resetResult();
      message.setAttribute("aria-invalid", "true");
      inputError.hidden = false;
      message.focus();
    }

    function showManualReview() {
      showStatus("manual", "Нужен ручной разбор", "Прочитайте заявку в форме и подготовьте ответ самостоятельно.");
    }

    message.addEventListener("input", resetResult);
    example.addEventListener("click", () => {
      message.value = "Здравствуйте! Когда будет доставка моего заказа?";
      resetResult();
      message.focus();
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (button.disabled) return;

      const text = message.value.trim();
      if (!text) {
        showInputError();
        return;
      }

      showStatus("pending", "Разбираем заявку…");
      button.disabled = true;
      example.disabled = true;
      message.readOnly = true;
      submitLabel.textContent = "Разбираем…";
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        const data = await reply.json();
        if (reply.ok && data?.status === "ready" && topics.has(data.topic) &&
            typeof data.draft === "string" && data.draft.trim()) {
          topic.textContent = topics.get(data.topic);
          draft.textContent = data.draft;
          statusPanel.hidden = true;
          answer.hidden = false;
        } else if (reply.status === 400 && data?.status === "invalid_input") {
          showInputError();
        } else {
          showManualReview();
        }
      } catch {
        showManualReview();
      } finally {
        button.disabled = false;
        example.disabled = false;
        message.readOnly = false;
        submitLabel.textContent = "Разобрать заявку";
      }
    });
  </script>
</body>
</html>
