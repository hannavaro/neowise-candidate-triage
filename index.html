<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5f1">
  <title>Входящие заявки · Neowise</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1c2822;
      --muted: #53615a;
      --line: #dce2da;
      --accent: #245744;
      --canvas: #f4f5f1;
      font-family: "Aptos", "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background: var(--canvas);
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; }
    button, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; }
    :focus-visible { outline: 2px solid #467b63; outline-offset: 3px; }

    .wrap { width: min(69rem, calc(100% - 4rem)); margin-inline: auto; }
    .masthead { border-bottom: 1px solid var(--line); background: #fff; }
    .masthead .wrap { display: flex; align-items: center; min-height: 3.625rem; }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: .625rem;
      font-size: 1.1875rem;
      font-weight: 700;
      letter-spacing: -.045em;
    }
    .brand-mark {
      display: inline-grid;
      grid-template-columns: repeat(2, 4px);
      align-items: end;
      gap: 3px;
      height: 1rem;
      transform: skewX(-20deg);
    }
    .brand-mark::before, .brand-mark::after { content: ""; background: var(--accent); }
    .brand-mark::before { height: 65%; }
    .brand-mark::after { height: 100%; }

    main { padding-block: clamp(2rem, 5vw, 4rem) 3rem; }
    h1, h2, h3, p, dl, dd { margin: 0; }
    h1 { font-size: clamp(2rem, 5vw, 3rem); line-height: 1.08; font-weight: 650; letter-spacing: -.045em; }
    .intro p { margin-top: .75rem; color: var(--muted); font-size: 1.0625rem; line-height: 1.5; }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1.13fr) minmax(0, 1fr);
      margin-top: 1.75rem;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fff;
    }
    .panel { display: flex; flex-direction: column; min-width: 0; }
    .panel + .panel { border-inline-start: 1px solid var(--line); }
    .panel-heading {
      display: flex;
      align-items: center;
      min-height: 3.375rem;
      padding: .875rem 1.5rem;
      border-bottom: 1px solid var(--line);
    }
    .panel-heading h2 { font-size: 1.0625rem; line-height: 1.35; font-weight: 650; }
    .panel-body { flex: 1; padding: 1.25rem 1.5rem 1.5rem; }
    .field-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: .125rem 1rem;
      margin-bottom: .5rem;
    }
    .field-heading label { font-size: .875rem; font-weight: 650; }
    .example {
      min-height: 2rem;
      padding: .25rem 0;
      border: 0;
      background: transparent;
      color: var(--accent);
      font-size: .875rem;
      text-decoration: underline;
      text-decoration-color: #90a99d;
      text-underline-offset: .2em;
    }
    .example:hover:not(:disabled) { text-decoration-color: currentColor; }
    .example:disabled { opacity: .55; }
    textarea {
      display: block;
      width: 100%;
      min-height: 11.5rem;
      padding: .875rem 1rem;
      resize: vertical;
      border: 1px solid #cbd4ca;
      border-radius: 6px;
      color: var(--ink);
      background: #fff;
      line-height: 1.6;
    }
    textarea::placeholder { color: #65716a; }
    textarea[aria-invalid="true"] { border-color: #ad3a36; }
    .input-error { margin-top: .5rem; color: #a02a27; font-size: .875rem; }
    .panel-footer {
      padding: .875rem 1.5rem;
      border-top: 1px solid var(--line);
      border-bottom-left-radius: 8px;
      background: #fafbf8;
    }
    .submit {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 9.5rem;
      min-height: 2.75rem;
      padding: .5rem 1rem;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      font-weight: 650;
    }
    .submit:hover:not(:disabled) { background: #183f31; }
    .submit:active:not(:disabled) { background: #123427; }
    .submit:disabled { background: #49685b; }

    .panel-result { border-radius: 0 8px 8px 0; background: #fafbf8; }
    .result { display: flex; flex-direction: column; }
    .status {
      display: flex;
      align-items: center;
      flex: 1;
      gap: .875rem;
      min-height: 10rem;
      padding: .875rem 0;
      color: var(--muted);
    }
    .status-symbol {
      display: grid;
      place-items: center;
      flex: 0 0 2rem;
      height: 2rem;
      border: 1px solid #d4ddd4;
      border-radius: 5px;
      color: #4b685a;
    }
    .status-symbol::before {
      content: "";
      width: .7rem;
      height: .875rem;
      border: 1px solid currentColor;
      border-radius: 2px;
      background: linear-gradient(currentColor, currentColor) center 37% / 55% 1px no-repeat,
                  linear-gradient(currentColor, currentColor) center 67% / 55% 1px no-repeat;
    }
    [data-state="pending"] .status-symbol::before {
      width: .875rem;
      height: .875rem;
      border: 1.5px solid #a9bcb0;
      border-top-color: currentColor;
      border-radius: 50%;
      background: none;
      animation: spin .75s linear infinite;
    }
    .status[data-state="manual"] {
      flex: 0 0 auto;
      align-items: flex-start;
      min-height: 0;
      margin-top: .25rem;
      padding: .875rem 1rem;
      border-inline-start: 2px solid #a66d2d;
      border-radius: 0 5px 5px 0;
      color: #623c1e;
      background: #f7efe2;
    }
    [data-state="manual"] .status-symbol { border-color: #e0ccaf; color: #80511e; }
    [data-state="manual"] .status-symbol::before {
      content: "!";
      width: auto;
      height: auto;
      border: 0;
      background: none;
      font-size: 1rem;
      font-weight: 700;
    }
    .status-title { font-size: .9375rem; font-weight: 650; line-height: 1.4; }
    .status-detail { margin-top: .25rem; font-size: .875rem; line-height: 1.5; }
    .status-detail:empty { display: none; }
    .topic-row { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .75rem; min-height: 2rem; }
    .topic-label { color: var(--muted); font-size: .875rem; }
    .topic { padding: .2rem .45rem; border-radius: 4px; background: #e8efe9; color: #254a3a; font-size: .875rem; font-weight: 650; }
    .draft { margin-top: 1rem; padding-top: 1.125rem; border-top: 1px solid var(--line); }
    .draft h3 { margin-bottom: .5rem; color: var(--muted); font-size: .875rem; font-weight: 650; }
    .draft p { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.6; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { [data-state="pending"] .status-symbol::before { animation: none; } }
    @media (max-width: 46rem) {
      .wrap { width: min(38rem, calc(100% - 2rem)); }
      .masthead .wrap { min-height: 3.25rem; }
      .workspace { grid-template-columns: minmax(0, 1fr); }
      .panel + .panel { border-inline-start: 0; border-top: 1px solid var(--line); }
      .panel-result { border-radius: 0 0 8px 8px; }
      .panel-footer { border-radius: 0; }
      .panel-heading, .panel-body, .panel-footer { padding-inline: 1rem; }
      .status { min-height: 5rem; }
      textarea { min-height: 9.5rem; }
    }
    @media (max-width: 26rem) { .submit { width: 100%; } }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="wrap">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Neowise</div>
    </div>
  </header>
  <main class="wrap">
    <div class="intro">
      <h1>Входящие заявки</h1>
      <p>Разберите обращение клиента и подготовьте ответ.</p>
    </div>
    <div class="workspace">
      <form class="panel" aria-labelledby="form-heading">
        <div class="panel-heading"><h2 id="form-heading">Заявка клиента</h2></div>
        <div class="panel-body">
          <div class="field-heading">
            <label for="message">Текст заявки</label>
            <button class="example" id="example" type="button">Подставить пример</button>
          </div>
          <textarea id="message" rows="6" placeholder="Вставьте сообщение клиента" aria-describedby="input-error"></textarea>
          <p class="input-error" id="input-error" role="alert" hidden>Введите текст заявки.</p>
        </div>
        <div class="panel-footer">
          <button class="submit" type="submit">Разобрать заявку</button>
        </div>
      </form>
      <section class="panel panel-result" aria-labelledby="result-heading">
        <div class="panel-heading"><h2 id="result-heading">Результат разбора</h2></div>
        <div class="panel-body result" id="result" aria-live="polite" aria-atomic="true">
          <div class="status" id="status" data-state="empty">
            <span class="status-symbol" aria-hidden="true"></span>
            <div>
              <p class="status-title" id="status-title">Заявка ещё не разобрана</p>
              <p class="status-detail" id="status-detail"></p>
            </div>
          </div>
          <div id="answer" hidden>
            <dl class="topic-row"><dt class="topic-label">Тема заявки</dt><dd class="topic" id="topic"></dd></dl>
            <div class="draft"><h3>Черновик ответа</h3><p id="draft"></p></div>
          </div>
        </div>
      </section>
    </div>
  </main>
  <script type="module">
    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const example = document.querySelector("#example");
    const button = form.querySelector('button[type="submit"]');
    const inputError = document.querySelector("#input-error");
    const statusPanel = document.querySelector("#status");
    const statusTitle = document.querySelector("#status-title");
    const statusDetail = document.querySelector("#status-detail");
    const answer = document.querySelector("#answer");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");
    const topics = new Map([["delivery", "Доставка"], ["pricing", "Цена"], ["other", "Другое"]]);

    function showStatus(state, title, detail = "") {
      answer.hidden = true;
      topic.textContent = "";
      draft.textContent = "";
      statusPanel.dataset.state = state;
      statusTitle.textContent = title;
      statusDetail.textContent = detail;
      statusPanel.hidden = false;
    }

    function resetResult() {
      if (statusPanel.dataset.state !== "empty") {
        showStatus("empty", "Заявка ещё не разобрана");
      }
      message.removeAttribute("aria-invalid");
      inputError.hidden = true;
    }

    function showInputError() {
      resetResult();
      message.setAttribute("aria-invalid", "true");
      inputError.hidden = false;
      message.focus();
    }

    function showManualReview() {
      showStatus("manual", "Нужен ручной разбор", "Прочитайте заявку в форме и подготовьте ответ самостоятельно.");
    }

    message.addEventListener("input", resetResult);
    example.addEventListener("click", () => {
      message.value = "Здравствуйте! Когда будет доставка моего заказа?";
      resetResult();
      message.focus();
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (button.disabled) return;

      const text = message.value.trim();
      if (!text) {
        showInputError();
        return;
      }

      showStatus("pending", "Разбираем заявку…");
      button.disabled = true;
      example.disabled = true;
      message.readOnly = true;
      button.textContent = "Разбираем…";
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        const data = await reply.json();
        if (reply.ok && data?.status === "ready" && topics.has(data.topic) &&
            typeof data.draft === "string" && data.draft.trim()) {
          topic.textContent = topics.get(data.topic);
          draft.textContent = data.draft;
          statusPanel.hidden = true;
          answer.hidden = false;
        } else if (reply.status === 400 && data?.status === "invalid_input") {
          showInputError();
        } else {
          showManualReview();
        }
      } catch {
        showManualReview();
      } finally {
        button.disabled = false;
        example.disabled = false;
        message.readOnly = false;
        button.textContent = "Разобрать заявку";
      }
    });
  </script>
</body>
</html>
